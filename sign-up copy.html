<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Form</title>
</head>
<body>
    <form action="">
        <h1>Sign Up</h1>
        <p>Please fill this form to creat an account.</p><hr>
        <label><b>Email: </b></label>
        <input type="email" placeholder="Enter Your email"><br><br>

        <label><b>Password: </b></label>
        <input type="password" placeholder="Enter Your password"><br><br>

        <label><b>confirm password: </b></label>
        <input type="email" placeholder="Enter Your confirm password"><br><br>

        <label><b>Number: </b></label>
        <input type="tel" placeholder="Enter Your number"><br><br>

        <label><b>Date of Birth: </b></label>
        <input type="date"><br><br>

        <input type="radio" name="gen"> Male
        <input type="radio" name="gen"> Female
        <input type="radio" name="gen"> others <br>

        
        <p>By Creating account you agree our <a href="#">Term & Policy</a></p>
        <input type="checkbox">Remember Me <br><br>

        <button type="button">Cancle</button>
        <button type="submit"> Submit</button>
    </form>
</body>
</html>
